
services:

  # ==========================================
  # PostgreSQL - Metadata Database
  # ==========================================

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storagepass
      POSTGRES_DB: storage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage -d storage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # Elasticsearch - Object Search
  # ==========================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ==========================================
  # Metadata Service - Phases 2, 3, 4
  # ==========================================

  metadata:
    build:
      context: .
      dockerfile: metadata_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://storage:storagepass@db:5432/storage
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # FastAPI Gateway - Phases 5, 6
  # ==========================================

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql://storage:storagepass@db:5432/storage
      METADATA_URL: http://metadata:8000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env}
      RATE_LIMIT: 6000
    ports:
      - "8200:8000"
    depends_on:
      db:
        condition: service_healthy
      metadata:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # Storage Node 1
  # ==========================================

  node1:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-1
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node1_data:/data
    ports:
      - "8001:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ==========================================
  # Storage Node 2
  # ==========================================

  node2:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-2
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node2_data:/data
    ports:
      - "8002:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ==========================================
  # Storage Node 3
  # ==========================================

  node3:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-3
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node3_data:/data
    ports:
      - "8003:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ==========================================
  # Storage Node 4
  # ==========================================

  node4:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-4
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node4_data:/data
    ports:
      - "8004:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ==========================================
  # Storage Node 5 - Additional Node
  # ==========================================

  node5:
    profiles:
      - extra
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-5
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node5_data:/data
    ports:
      - "8005:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ==========================================
  # Storage Node 6 - Erasure Coding
  # ==========================================

  node6:
    profiles:
      - extra
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-6
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node6_data:/data
    ports:
      - "8006:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ==========================================
  # Storage Node 7 - Repair Replacement
  # ==========================================

  node7:
    profiles:
      - replacement
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    environment:
      NODE_ID: node-7
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
    volumes:
      - node7_data:/data
    ports:
      - "8007:8000"
    depends_on:
      - metadata
    restart: unless-stopped


# ==========================================
# Persistent Docker Volumes
# ==========================================

volumes:
  postgres_data:
  elasticsearch_data:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  node6_data:
  node7_data:
